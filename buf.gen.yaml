version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  # 经 node 运行入口脚本: Windows 上 .bin 下是 cmd 包装, 无法以 / 分隔的路径执行.
  - local: [node, web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: web/src/gen
    opt: target=ts
